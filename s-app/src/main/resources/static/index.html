<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 自习室管家台 · Library Seat</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#f5f6f8; color:#22272e; }
  header { background:linear-gradient(135deg,#274156,#4a7a96); color:#fff; padding:18px 28px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:20px; }
  header .sub { font-size:12px; opacity:.85; margin-top:4px; }
  header .badge { font-size:13px; background:rgba(255,255,255,.15); padding:6px 14px; border-radius:20px; }
  main { display:grid; grid-template-columns:1fr 340px; gap:16px; padding:16px 20px; max-width:1240px; margin:0 auto; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .card { background:#fff; border-radius:12px; padding:16px 18px; box-shadow:0 1px 4px rgba(39,65,86,.08); }
  .card h2 { font-size:15px; margin-bottom:12px; color:#274156; }
  .stat { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .stat div { background:#edf3f6; border-radius:10px; padding:12px; }
  .stat b { display:block; font-size:22px; color:#4a7a96; margin-top:4px; }
  .stat span { font-size:12px; color:#71808f; }
  .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; }
  .tag.g { background:#e3f4e9; color:#218a58; }
  .tag.y { background:#fdf3e0; color:#c07f16; }
  .tag.r { background:#fdeaea; color:#c74a44; }
  .tag.b { background:#e7f0fb; color:#2e5fa3; }
  .rm { border:1px solid #e3e8ee; border-radius:10px; padding:10px 14px; margin-bottom:10px; }
  .rm .top { display:flex; justify-content:space-between; margin-bottom:4px; }
  .rm b { color:#274156; font-size:13.5px; }
  .rm .meta { font-size:12.5px; color:#5a6a7a; line-height:1.7; }
  .bar { height:8px; background:#e3e8ee; border-radius:4px; overflow:hidden; margin-top:6px; }
  .bar i { display:block; height:100%; background:#4a7a96; }
  .bar i.warn { background:#c74a44; }
  .ai-panel { position:sticky; top:16px; display:flex; flex-direction:column; height:calc(100vh - 32px); background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 4px rgba(39,65,86,.08); }
  .ai-head { background:linear-gradient(135deg,#274156,#4a7a96); color:#fff; padding:14px 16px; }
  .ai-head b { font-size:15px; }
  .ai-head .sub { font-size:11px; opacity:.85; margin-top:3px; }
  .ai-body { flex:1; overflow-y:auto; padding:14px; font-size:13.5px; line-height:1.75; }
  .ai-body .msg { margin-bottom:12px; white-space:pre-wrap; word-break:break-word; }
  .ai-body .msg.user { background:#edf3f6; border-radius:10px 10px 2px 10px; padding:8px 12px; margin-left:24px; color:#22272e; }
  .chips { padding:8px 14px; display:flex; flex-wrap:wrap; gap:6px; border-top:1px solid #eef1f5; }
  .chip { font-size:12px; background:#edf3f6; color:#274156; border:none; border-radius:14px; padding:5px 10px; cursor:pointer; }
  .chip:hover { background:#dfe8ed; }
  .ai-input { display:flex; gap:8px; padding:10px 14px; border-top:1px solid #eef1f5; }
  .ai-input input { flex:1; border:1px solid #d5dce4; border-radius:8px; padding:9px 12px; font-size:13px; outline:none; }
  .ai-input input:focus { border-color:#4a7a96; }
  .ai-input button { background:#4a7a96; color:#fff; border:none; border-radius:8px; padding:0 18px; font-size:13px; cursor:pointer; }
  .ai-input button:disabled { background:#a9bcc6; }
</style>
</head>
<body>
<header>
  <div>
    <h1>📚 AI 自习室管家台</h1>
    <div class="sub">座位 · 预约 · 签到 · 人流 | 图书馆自习区云平台</div>
  </div>
  <div class="badge" id="topBadge">加载中…</div>
</header>
<main>
  <div class="col">
    <div class="card">
      <h2>自习区总览</h2>
      <div class="stat" id="stats"></div>
    </div>
    <div class="card">
      <h2>各区余座</h2>
      <div id="rooms"></div>
    </div>
    <div class="card">
      <h2>今日预约</h2>
      <div id="bookings"></div>
    </div>
  </div>
  <div class="ai-panel">
    <div class="ai-head">
      <b>📖 AI 自习室管家</b>
      <div class="sub">study-copilot · 座位 / 预约 / 签到 / 人流</div>
    </div>
    <div class="ai-body" id="aiBody"></div>
    <div class="chips">
      <button class="chip" onclick="ask('现在哪个区还有空座？有电源座吗？')">查余座</button>
      <button class="chip" onclick="ask('帮我预约今天 19:00-21:00 静音区 A03')">快速预约</button>
      <button class="chip" onclick="ask('学号 20213005 的预约到哪一步了？')">查预约</button>
      <button class="chip" onclick="ask('现在各区人流怎么样？几点人最少？')">人流分析</button>
    </div>
    <div class="ai-input">
      <input id="q" placeholder="例如：静音区还有窗边座吗？帮我约今晚的" onkeydown="if(event.key==='Enter')send()">
      <button id="sendBtn" onclick="send()">发送</button>
    </div>
  </div>
</main>
<script>
const j = r => Promise.resolve(r).then(resp => resp.json()).then(d => d.data ?? d);
const bkTag = s => s==='待签到' ? '<span class="tag y">待签到</span>' : s==='使用中' ? '<span class="tag g">使用中</span>' : s==='已完成' ? '<span class="tag b">已完成</span>' : s==='已违约' ? '<span class="tag r">已违约</span>' : '<span class="tag">已取消</span>';
async function load() {
  try {
    const st = await j(fetch('/api/stats'));
    document.getElementById('topBadge').textContent = `总座 ${st.totalSeats} · 空闲 ${st.freeSeats}`;
    document.getElementById('stats').innerHTML = `
      <div><span>总座位</span><b>${st.totalSeats}</b></div>
      <div><span>空闲</span><b style="color:#218a58">${st.freeSeats}</b></div>
      <div><span>违约记录</span><b style="color:${st.violations>0?'#c74a44':'#218a58'}">${st.violations}</b></div>
      <div><span>提示</span><b style="font-size:12px;line-height:1.5;color:#5a6a7a">违约 2 次暂停预约 3 天</b></div>`;
    const rm = st.rooms;
    document.getElementById('rooms').innerHTML = Object.keys(rm).map(name => {
      const x = rm[name];
      return `<div class="rm">
        <div class="top"><b>${name}</b><span class="${x.usageRate>=80?'tag r':'tag g'}">使用率 ${x.usageRate}%</span></div>
        <div class="meta">开放 ${x.openTime} · 空闲 ${x.free}/${x.total} · ${x.rule}</div>
        <div class="bar"><i class="${x.usageRate>=80?'warn':''}" style="width:${x.usageRate}%"></i></div>
      </div>`;
    }).join('');
    const bs = await j(fetch('/api/bookings'));
    document.getElementById('bookings').innerHTML = bs.map(b => `
      <div class="rm">
        <div class="top"><b>${b.id} · ${b.seatId}</b>${bkTag(b.status)}</div>
        <div class="meta">${b.student}（${b.studentId}）· ${b.start}${b.note?` · ${b.note}`:''}</div>
      </div>`).join('');
  } catch(e) { console.error(e); }
}
function ask(t) { document.getElementById('q').value = t; send(); }
async function send() {
  const inp = document.getElementById('q'), btn = document.getElementById('sendBtn');
  const text = inp.value.trim(); if (!text || btn.disabled) return;
  inp.value = ''; btn.disabled = true;
  const body = document.getElementById('aiBody');
  const u = document.createElement('div'); u.className = 'msg user'; u.textContent = text; body.appendChild(u);
  const a = document.createElement('div'); a.className = 'msg'; a.textContent = '…'; body.appendChild(a);
  try {
    const resp = await fetch('/api/assistant/stream', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message:text}) });
    const reader = resp.body.getReader(), dec = new TextDecoder(); let buf = '', out = '';
    for (;;) {
      const {done, value} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const p of parts) {
        for (const line of p.split('\n')) {
          if (!line.startsWith('data:')) continue;
          const dstr = line.slice(5).trim(); if (!dstr || dstr === '[DONE]') continue;
          try {
            const d = JSON.parse(dstr);
            const piece = d.content ?? d.delta ?? '';
            if (typeof piece === 'string' && piece) { out += piece; a.textContent = out; body.scrollTop = body.scrollHeight; }
          } catch(e) {}
        }
      }
    }
    if (!out) a.textContent = '（无返回内容）';
  } catch(e) { a.textContent = 'AI 服务暂时不可用：' + e.message; }
  btn.disabled = false; body.scrollTop = body.scrollHeight;
}
load();
</script>
</body>
</html>
